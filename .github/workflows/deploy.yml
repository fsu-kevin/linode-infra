name: Deploy

on:
  push:
    branches: [main]

jobs:
  provision:
    runs-on: ubuntu-latest
    outputs:
      vm_ips: ${{ steps.get_vms.outputs.vm_ips }}
      vm_private_ips: ${{ steps.get_vms.outputs.vm_private_ips }}
      vm_labels: ${{ steps.get_vms.outputs.vm_labels }}
      firewall_id: ${{ steps.setup_firewall.outputs.firewall_id }}
      nb_id: ${{ steps.setup_lb.outputs.nb_id }}
      nb_config_id: ${{ steps.setup_lb.outputs.nb_config_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup firewall if not exists
        id: setup_firewall
        run: |
          FIREWALL_ID=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/networking/firewalls | \
            jq -r '.data[] | select(.label=="linode-automation-app") | .id')

          if [ -z "$FIREWALL_ID" ] || [ "$FIREWALL_ID" = "null" ]; then
            echo "Creating firewall..."
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -X POST https://api.linode.com/v4/networking/firewalls \
              -d '{
                "label": "linode-automation-app",
                "rules": {
                  "inbound_policy": "DROP",
                  "outbound_policy": "ACCEPT",
                  "inbound": [
                    {
                      "label": "accept-http",
                      "action": "ACCEPT",
                      "protocol": "TCP",
                      "ports": "80",
                      "addresses": {"ipv4": ["0.0.0.0/0"], "ipv6": ["::/0"]}
                    },
                    {
                      "label": "accept-https",
                      "action": "ACCEPT",
                      "protocol": "TCP",
                      "ports": "443",
                      "addresses": {"ipv4": ["0.0.0.0/0"], "ipv6": ["::/0"]}
                    }
                  ]
                }
              }')
            echo "Firewall response: $RESPONSE"
            FIREWALL_ID=$(echo $RESPONSE | jq -r '.id')
            if [ -z "$FIREWALL_ID" ] || [ "$FIREWALL_ID" = "null" ]; then
              echo "Failed to create firewall"
              exit 1
            fi
            echo "Firewall created: $FIREWALL_ID"
          else
            echo "Firewall already exists: $FIREWALL_ID"
          fi
          echo "firewall_id=$FIREWALL_ID" >> $GITHUB_OUTPUT

      - name: Create VMs to reach count of 2
        run: |
          EXISTING=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/linode/instances | \
            jq '[.data[] | select(.tags != null and (.tags | contains(["linode-automation-app"])) and (.label | startswith("app-")))]')
          COUNT=$(echo $EXISTING | jq 'length')
          NEEDED=$((2 - COUNT))
          echo "Existing: $COUNT, creating: $NEEDED"

          for i in $(seq 1 $NEEDED); do
            USERDATA=$(base64 -w0 cloud-init.yaml)
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -X POST https://api.linode.com/v4/linode/instances \
              -d "{
                \"image\": \"linode/ubuntu22.04\",
                \"region\": \"us-east\",
                \"type\": \"g6-nanode-1\",
                \"label\": \"app-new-${{ github.run_id }}-$i\",
                \"tags\": [\"linode-automation-app\"],
                \"root_pass\": \"${{ secrets.VM_ROOT_PASS }}\",
                \"authorized_keys\": [\"${{ secrets.SSH_PUBLIC_KEY }}\"],
                \"private_ip\": true,
                \"metadata\": {\"user_data\": \"$USERDATA\"}
              }")
            echo "Create response: $RESPONSE"
            LINODE_ID=$(echo $RESPONSE | jq -r '.id')
            if [ -z "$LINODE_ID" ] || [ "$LINODE_ID" = "null" ]; then
              echo "VM creation failed"
              exit 1
            fi
            curl -s \
              -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -X PUT https://api.linode.com/v4/linode/instances/$LINODE_ID \
              -d "{\"label\": \"app-$LINODE_ID\"}"
            curl -s \
              -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -X POST https://api.linode.com/v4/networking/firewalls/${{ steps.setup_firewall.outputs.firewall_id }}/devices \
              -d "{\"id\": $LINODE_ID, \"type\": \"linode\"}"
            echo "Created: app-$LINODE_ID"
          done

      - name: Wait for 2 running VMs
        run: |
          for i in $(seq 1 40); do
            COUNT=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
              https://api.linode.com/v4/linode/instances | \
              jq '[.data[] | select(.tags != null and (.tags | contains(["linode-automation-app"])) and (.label | startswith("app-")) and .status == "running")] | length')
            echo "Attempt $i: $COUNT running"
            if [ "$COUNT" -ge 2 ]; then
              echo "Both VMs running"
              break
            fi
            sleep 15
          done
          if [ "$COUNT" -lt 2 ]; then
            echo "Timed out waiting for VMs"
            exit 1
          fi

      - name: Get VM details
        id: get_vms
        run: |
          VMS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/linode/instances | \
            jq '[.data[] | select(.tags != null and (.tags | contains(["linode-automation-app"])) and (.label | startswith("app-")))]')

          VM_IPS=$(echo $VMS | jq -c '[.[].ipv4 | map(select(startswith("192.168.") | not)) | .[0]]')
          VM_PRIVATE_IPS=$(echo $VMS | jq -c '[.[].ipv4 | map(select(startswith("192.168."))) | .[0]]')
          VM_LABELS=$(echo $VMS | jq -c '[.[].label]')

          echo "vm_ips=$VM_IPS" >> $GITHUB_OUTPUT
          echo "vm_private_ips=$VM_PRIVATE_IPS" >> $GITHUB_OUTPUT
          echo "vm_labels=$VM_LABELS" >> $GITHUB_OUTPUT
          echo "Labels: $VM_LABELS | Public: $VM_IPS | Private: $VM_PRIVATE_IPS"

      - name: Setup NodeBalancer
        id: setup_lb
        run: |
          NB_ID=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/nodebalancers | \
            jq -r '.data[] | select(.label=="linode-automation-app-lb") | .id')

          if [ -z "$NB_ID" ] || [ "$NB_ID" = "null" ]; then
            echo "Creating NodeBalancer..."
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -X POST https://api.linode.com/v4/nodebalancers \
              -d '{"label": "linode-automation-app-lb", "region": "us-east"}')
            echo "NodeBalancer response: $RESPONSE"
            NB_ID=$(echo $RESPONSE | jq -r '.id')
            if [ -z "$NB_ID" ] || [ "$NB_ID" = "null" ]; then
              echo "Failed to create NodeBalancer"
              exit 1
            fi
          fi
          echo "NodeBalancer: $NB_ID"

          CONFIG_ID=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/nodebalancers/$NB_ID/configs | \
            jq -r '.data[] | select(.port==80) | .id')

          if [ -z "$CONFIG_ID" ] || [ "$CONFIG_ID" = "null" ]; then
            echo "Creating HTTP config..."
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -X POST https://api.linode.com/v4/nodebalancers/$NB_ID/configs \
              -d '{
                "port": 80,
                "protocol": "http",
                "algorithm": "roundrobin",
                "check": "http",
                "check_path": "/",
                "check_interval": 10,
                "check_timeout": 5,
                "check_attempts": 3
              }')
            echo "Config response: $RESPONSE"
            CONFIG_ID=$(echo $RESPONSE | jq -r '.id')
          fi
          echo "Config: $CONFIG_ID"

          echo "nb_id=$NB_ID" >> $GITHUB_OUTPUT
          echo "nb_config_id=$CONFIG_ID" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: provision

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Allow SSH from runner IP
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Runner IP: $RUNNER_IP"

          CURRENT_RULES=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/networking/firewalls/${{ needs.provision.outputs.firewall_id }}/rules)

          BODY=$(echo $CURRENT_RULES | jq --arg ip "$RUNNER_IP/32" '{
            inbound_policy: "DROP",
            outbound_policy: "ACCEPT",
            outbound: .outbound,
            inbound: ([.inbound[] | select(.label != "temp-ssh-runner")] + [{
              label: "temp-ssh-runner",
              action: "ACCEPT",
              protocol: "TCP",
              ports: "22",
              addresses: {ipv4: [$ip]}
            }])
          }')

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -X PUT https://api.linode.com/v4/networking/firewalls/${{ needs.provision.outputs.firewall_id }}/rules \
            -d "$BODY")
          echo "Firewall update: $RESPONSE"
          if echo $RESPONSE | jq -e '.errors' > /dev/null 2>&1; then
            echo "Failed to update firewall"
            exit 1
          fi
          echo "SSH allowed from $RUNNER_IP"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null && echo "Key valid" || { echo "Key INVALID"; exit 1; }

          for IP in $(echo '${{ needs.provision.outputs.vm_ips }}' | jq -r '.[]'); do
            echo "Waiting for SSH on $IP..."
            for i in $(seq 1 20); do
              if ssh-keyscan -H $IP >> ~/.ssh/known_hosts 2>/dev/null; then
                echo "SSH ready: $IP"
                break
              fi
              sleep 15
            done
          done

      - name: Deploy to each VM
        run: |
          VM_IPS='${{ needs.provision.outputs.vm_ips }}'
          VM_LABELS='${{ needs.provision.outputs.vm_labels }}'
          COUNT=$(echo $VM_IPS | jq 'length')

          for idx in $(seq 0 $((COUNT - 1))); do
            IP=$(echo $VM_IPS | jq -r ".[$idx]")
            LABEL=$(echo $VM_LABELS | jq -r ".[$idx]")
            echo "=== Deploying to $LABEL ($IP) ==="

            ssh root@$IP "cloud-init status --wait && echo cloud-init done"
            rsync -avz --exclude 'node_modules' --exclude '.git' ./ root@$IP:/opt/app/
            ssh root@$IP "hostnamectl set-hostname $LABEL"

            ssh root@$IP << 'EOF'
              echo "LINODE_TOKEN=${{ secrets.LINODE_TOKEN }}" > /opt/app/backend/.env
              echo "PORT=3001" >> /opt/app/backend/.env

              cd /opt/app/backend && npm install && npm run build
              cd /opt/app/frontend && npm install && npm run build

              printf 'server {\n    listen 80;\n    server_name _;\n\n    root /opt/app/frontend/dist;\n    index index.html;\n\n    location / {\n        try_files $uri $uri/ /index.html;\n    }\n\n    location /api {\n        proxy_pass http://localhost:3001;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n    }\n}\n' > /etc/nginx/sites-available/app
              nginx -t && systemctl reload nginx

              pm2 delete backend 2>/dev/null || true
              pm2 start /opt/app/backend/dist/index.js --name "backend"
              pm2 save

              cp /opt/app/alloy/config.alloy /etc/alloy/config.alloy
              cp /opt/app/vault/agent.hcl /etc/vault.d/agent.hcl
              echo "${{ secrets.VAULT_AGENT_TOKEN }}" > /etc/vault.d/token
              chmod 600 /etc/vault.d/token

              printf '[Unit]\nDescription=Vault Agent\nAfter=network.target\n\n[Service]\nEnvironment=VAULT_ADDR=http://192.168.215.38:8200\nExecStart=/usr/bin/vault agent -config=/etc/vault.d/agent.hcl\nRestart=always\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/vault-agent.service
              systemctl daemon-reload
              systemctl enable vault-agent
              systemctl restart vault-agent

              export VAULT_ADDR="http://192.168.215.38:8200"
              export VAULT_TOKEN=$(cat /etc/vault.d/token)
              OBJ_KEY=$(vault kv get -field=object_storage_key secret/linode | tr -d '[:space:]')
              OBJ_SECRET=$(vault kv get -field=object_storage_secret secret/linode | tr -d '[:space:]')
              BUCKET=$(vault kv get -field=bucket_name secret/linode | tr -d '[:space:]/')
              REGION=$(vault kv get -field=bucket_region secret/linode | tr -d '[:space:]')
              echo "Mounting: $BUCKET ($REGION)"
              echo "${OBJ_KEY}:${OBJ_SECRET}" > /root/.passwd-s3fs
              chmod 600 /root/.passwd-s3fs
              mkdir -p /mnt/backup
              mountpoint -q /mnt/backup || s3fs ${BUCKET} /mnt/backup \
                -o passwd_file=/root/.passwd-s3fs \
                -o url=https://${REGION}.linodeobjects.com \
                -o use_path_request_style
              grep -q "s3fs" /etc/fstab || \
                echo "${BUCKET} /mnt/backup fuse.s3fs _netdev,allow_other,use_path_request_style,passwd_file=/root/.passwd-s3fs,url=https://${REGION}.linodeobjects.com 0 0" >> /etc/fstab
              mkdir -p /mnt/backup/configs
              cp /etc/alloy/config.alloy /mnt/backup/configs/
              cp /etc/vault.d/agent.hcl /mnt/backup/configs/
EOF
          done

      - name: Register NodeBalancer backends
        run: |
          VM_PRIVATE_IPS='${{ needs.provision.outputs.vm_private_ips }}'
          VM_LABELS='${{ needs.provision.outputs.vm_labels }}'
          NB_ID=${{ needs.provision.outputs.nb_id }}
          CONFIG_ID=${{ needs.provision.outputs.nb_config_id }}

          echo "Clearing existing backends..."
          EXISTING=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/nodebalancers/$NB_ID/configs/$CONFIG_ID/nodes)
          for NODE_ID in $(echo $EXISTING | jq -r '.data[].id'); do
            curl -s -X DELETE \
              -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
              https://api.linode.com/v4/nodebalancers/$NB_ID/configs/$CONFIG_ID/nodes/$NODE_ID
          done

          COUNT=$(echo $VM_PRIVATE_IPS | jq 'length')
          for idx in $(seq 0 $((COUNT - 1))); do
            PRIVATE_IP=$(echo $VM_PRIVATE_IPS | jq -r ".[$idx]")
            LABEL=$(echo $VM_LABELS | jq -r ".[$idx]")
            echo "Registering $LABEL ($PRIVATE_IP:80)..."
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -X POST https://api.linode.com/v4/nodebalancers/$NB_ID/configs/$CONFIG_ID/nodes \
              -d "{\"address\": \"$PRIVATE_IP:80\", \"label\": \"$LABEL\", \"weight\": 100, \"mode\": \"accept\"}")
            echo "Backend response: $RESPONSE"
          done

      - name: Verify
        run: |
          VM_IPS='${{ needs.provision.outputs.vm_ips }}'
          VM_LABELS='${{ needs.provision.outputs.vm_labels }}'
          COUNT=$(echo $VM_IPS | jq 'length')

          for idx in $(seq 0 $((COUNT - 1))); do
            IP=$(echo $VM_IPS | jq -r ".[$idx]")
            LABEL=$(echo $VM_LABELS | jq -r ".[$idx]")
            echo "=== $LABEL ($IP) ==="
            ssh root@$IP << 'EOF'
              echo "hostname: $(hostname)"
              echo "--- PM2 ---"
              pm2 status
              echo "--- backend logs ---"
              pm2 logs backend --lines 10 --nostream
              echo "--- vault-agent ---"
              systemctl is-active vault-agent
              echo "--- alloy ---"
              curl -s http://localhost:12345/-/healthy || echo "not responding"
              echo "--- nginx ---"
              systemctl is-active nginx
              echo "--- object storage ---"
              df -h | grep backup || echo "not mounted"
EOF
          done

          echo "=== NodeBalancer backends ==="
          curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/nodebalancers/${{ needs.provision.outputs.nb_id }}/configs/${{ needs.provision.outputs.nb_config_id }}/nodes | \
            jq '.data[] | {label, address, status}'

          NB_IP=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/nodebalancers/${{ needs.provision.outputs.nb_id }} | \
            jq -r '.ipv4')
          echo "NodeBalancer IP: $NB_IP"
          curl -s -o /dev/null -w "NodeBalancer HTTP status: %{http_code}\n" http://$NB_IP/

      - name: Remove SSH runner access
        if: always()
        run: |
          CURRENT_RULES=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/networking/firewalls/${{ needs.provision.outputs.firewall_id }}/rules)

          BODY=$(echo $CURRENT_RULES | jq '{
            inbound_policy: "DROP",
            outbound_policy: "ACCEPT",
            outbound: .outbound,
            inbound: [.inbound[] | select(.label != "temp-ssh-runner")]
          }')

          curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -X PUT https://api.linode.com/v4/networking/firewalls/${{ needs.provision.outputs.firewall_id }}/rules \
            -d "$BODY"
          echo "SSH access removed"
