name: Deploy

on:
  push:
    branches: [main]

jobs:
  provision:
    runs-on: ubuntu-latest
    outputs:
      vm_ip: ${{ steps.get_ip.outputs.vm_ip }}
      firewall_id: ${{ steps.setup_firewall.outputs.firewall_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup firewall if not exists
        id: setup_firewall
        run: |
          FIREWALL_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/networking/firewalls | \
            jq -r '.data[] | select(.label=="linode-automation-app") | .id')

          if [ -z "$FIREWALL_ID" ]; then
            echo "Creating firewall..."
            FIREWALL_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -X POST https://api.linode.com/v4/networking/firewalls \
              -d '{
                "label": "linode-automation-app",
                "rules": {
                  "inbound_policy": "DROP",
                  "outbound_policy": "ACCEPT",
                  "inbound": [
                    {
                      "label": "accept-http",
                      "action": "ACCEPT",
                      "protocol": "TCP",
                      "ports": "80",
                      "addresses": {"ipv4": ["0.0.0.0/0"], "ipv6": ["::/0"]}
                    },
                    {
                      "label": "accept-https",
                      "action": "ACCEPT",
                      "protocol": "TCP",
                      "ports": "443",
                      "addresses": {"ipv4": ["0.0.0.0/0"], "ipv6": ["::/0"]}
                    }
                  ]
                }
              }' | jq -r '.id')
            echo "Firewall created: $FIREWALL_ID"
          else
            echo "Firewall already exists: $FIREWALL_ID"
          fi
          echo "firewall_id=$FIREWALL_ID" >> $GITHUB_OUTPUT

      - name: Provision VM if not exists
        run: |
          EXISTS=$(curl -s -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/linode/instances | \
            jq '[.data[] | select(.label=="app-1")] | length')

          if [ "$EXISTS" -eq 0 ]; then
            echo "Provisioning new VM..."
            LINODE_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -X POST https://api.linode.com/v4/linode/instances \
              -d "{
                \"image\": \"linode/ubuntu22.04\",
                \"region\": \"us-east\",
                \"type\": \"g6-nanode-1\",
                \"label\": \"app-1\",
                \"tags\": [\"linode-automation-app\"],
                \"root_pass\": \"${{ secrets.VM_ROOT_PASS }}\",
                \"authorized_keys\": [\"${{ secrets.SSH_PUBLIC_KEY }}\"],
                \"private_ip\": true,
                \"metadata\": {\"user_data\": \"$(base64 -w0 cloud-init.yaml)\"}
              }" | jq -r '.id')

            echo "VM created: $LINODE_ID"

            echo "Assigning firewall to VM..."
            curl -s -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -X POST https://api.linode.com/v4/networking/firewalls/${{ steps.setup_firewall.outputs.firewall_id }}/devices \
              -d "{\"id\": $LINODE_ID, \"type\": \"linode\"}"
          else
            echo "VM already exists, skipping provision"
          fi

      - name: Wait for VM to be running
        run: |
          echo "Waiting for VM to reach running state..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
              https://api.linode.com/v4/linode/instances | \
              jq -r '.data[] | select(.label=="app-1") | .status')
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "running" ]; then
              echo "VM is running"
              break
            fi
            sleep 15
          done
          if [ "$STATUS" != "running" ]; then
            echo "VM did not reach running state in time"
            exit 1
          fi

      - name: Get VM IP
        id: get_ip
        run: |
          IP=$(curl -s -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/linode/instances | \
            jq -r '.data[] | select(.label=="app-1") | .ipv4[0]')
          echo "vm_ip=$IP" >> $GITHUB_OUTPUT
          echo "VM IP: $IP"
          if [ -z "$IP" ]; then
            echo "Failed to get VM IP"
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: provision

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Allow SSH from runner IP
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Runner IP: $RUNNER_IP"
          CURRENT_RULES=$(curl -s -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/networking/firewalls/${{ needs.provision.outputs.firewall_id }}/rules)

          INBOUND=$(echo $CURRENT_RULES | jq '.inbound')
          NEW_INBOUND=$(echo $INBOUND | jq --arg ip "$RUNNER_IP/32" '. + [{
            "label": "temp-ssh-runner",
            "action": "ACCEPT",
            "protocol": "TCP",
            "ports": "22",
            "addresses": {"ipv4": [$ip]}
          }]')

          curl -s -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -X PUT https://api.linode.com/v4/networking/firewalls/${{ needs.provision.outputs.firewall_id }}/rules \
            -d "{\"inbound_policy\": \"DROP\", \"outbound_policy\": \"ACCEPT\", \"inbound\": $NEW_INBOUND}"

          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Waiting for SSH to be ready..."
          for i in $(seq 1 20); do
            if ssh-keyscan -H ${{ needs.provision.outputs.vm_ip }} >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Attempt $i: SSH not ready yet..."
            sleep 15
          done

      - name: Deploy app
        run: |
          rsync -avz --exclude 'node_modules' --exclude '.git' \
            ./ root@${{ needs.provision.outputs.vm_ip }}:/opt/app/

      - name: Install dependencies and restart
        run: |
          ssh root@${{ needs.provision.outputs.vm_ip }} << 'EOF'
            cd /opt/app
            npm install
            pm2 restart app || pm2 start npm --name "app" -- start
            pm2 save
          EOF

      - name: Push configs to VM
        run: |
          ssh root@${{ needs.provision.outputs.vm_ip }} << 'EOF'
            cp /opt/app/alloy/config.alloy /etc/alloy/config.alloy
            cp /opt/app/vault/agent.hcl /etc/vault.d/agent.hcl
          EOF

      - name: Setup Vault Agent token
        run: |
          ssh root@${{ needs.provision.outputs.vm_ip }} << 'EOF'
            echo "${{ secrets.VAULT_AGENT_TOKEN }}" > /etc/vault.d/token
            chmod 600 /etc/vault.d/token
          EOF

      - name: Setup Vault Agent service
        run: |
          ssh root@${{ needs.provision.outputs.vm_ip }} << 'EOF'
            printf '[Unit]\nDescription=Vault Agent\nAfter=network.target\n\n[Service]\nEnvironment=VAULT_ADDR=http://192.168.215.38:8200\nExecStart=/usr/bin/vault agent -config=/etc/vault.d/agent.hcl\nRestart=always\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/vault-agent.service
            systemctl daemon-reload
            systemctl enable vault-agent
            systemctl restart vault-agent
          EOF

      - name: Mount object storage
        run: |
          ssh root@${{ needs.provision.outputs.vm_ip }} << 'EOF'
            export VAULT_ADDR="http://192.168.215.38:8200"
            export VAULT_TOKEN=$(cat /etc/vault.d/token)
            OBJ_KEY=$(vault kv get -field=object_storage_key secret/linode)
            OBJ_SECRET=$(vault kv get -field=object_storage_secret secret/linode)
            BUCKET=$(vault kv get -field=bucket_name secret/linode)
            REGION=$(vault kv get -field=bucket_region secret/linode)

            echo "${OBJ_KEY}:${OBJ_SECRET}" > /root/.passwd-s3fs
            chmod 600 /root/.passwd-s3fs
            mkdir -p /mnt/backup
            mountpoint -q /mnt/backup || s3fs ${BUCKET} /mnt/backup \
              -o passwd_file=/root/.passwd-s3fs \
              -o url=https://${REGION}.linodeobjects.com \
              -o use_path_request_style

            grep -q "s3fs" /etc/fstab || echo "${BUCKET} /mnt/backup fuse.s3fs _netdev,allow_other,use_path_request_style,passwd_file=/root/.passwd-s3fs,url=https://${REGION}.linodeobjects.com 0 0" >> /etc/fstab
          EOF

      - name: Backup configs to object storage
        run: |
          ssh root@${{ needs.provision.outputs.vm_ip }} << 'EOF'
            mkdir -p /mnt/backup/configs
            cp /etc/alloy/config.alloy /mnt/backup/configs/
            cp /etc/vault.d/agent.hcl /mnt/backup/configs/
          EOF

      - name: Verify deployment
        run: |
          ssh root@${{ needs.provision.outputs.vm_ip }} << 'EOF'
            echo "=== PM2 status ==="
            pm2 status
            echo "=== Vault Agent ==="
            systemctl is-active vault-agent
            echo "=== Alloy health ==="
            curl -s http://localhost:12345/-/healthy
            echo "=== nginx ==="
            systemctl is-active nginx
            echo "=== Object storage ==="
            df -h | grep backup
          EOF

      - name: Remove SSH runner access
        if: always()
        run: |
          CURRENT_RULES=$(curl -s -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/networking/firewalls/${{ needs.provision.outputs.firewall_id }}/rules)

          NEW_INBOUND=$(echo $CURRENT_RULES | jq '[.inbound[] | select(.label != "temp-ssh-runner")]')

          curl -s -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -X PUT https://api.linode.com/v4/networking/firewalls/${{ needs.provision.outputs.firewall_id }}/rules \
            -d "{\"inbound_policy\": \"DROP\", \"outbound_policy\": \"ACCEPT\", \"inbound\": $NEW_INBOUND}"
          echo "SSH access removed from firewall"
