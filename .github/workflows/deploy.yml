name: Deploy

on:
  push:
    branches: [main]

jobs:
  provision:
    runs-on: ubuntu-latest
    outputs:
      vm_ip: ${{ steps.get_vm.outputs.vm_ip }}
      vm_id: ${{ steps.get_vm.outputs.vm_id }}
      firewall_id: ${{ steps.setup_firewall.outputs.firewall_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup firewall if not exists
        id: setup_firewall
        run: |
          FIREWALL_ID=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/networking/firewalls | \
            jq -r '.data[] | select(.label=="linode-automation-app") | .id')

          if [ -z "$FIREWALL_ID" ] || [ "$FIREWALL_ID" = "null" ]; then
            echo "Creating firewall..."
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -X POST https://api.linode.com/v4/networking/firewalls \
              -d '{
                "label": "linode-automation-app",
                "rules": {
                  "inbound_policy": "DROP",
                  "outbound_policy": "ACCEPT",
                  "inbound": [
                    {
                      "label": "accept-http",
                      "action": "ACCEPT",
                      "protocol": "TCP",
                      "ports": "80",
                      "addresses": {"ipv4": ["0.0.0.0/0"], "ipv6": ["::/0"]}
                    },
                    {
                      "label": "accept-https",
                      "action": "ACCEPT",
                      "protocol": "TCP",
                      "ports": "443",
                      "addresses": {"ipv4": ["0.0.0.0/0"], "ipv6": ["::/0"]}
                    }
                  ]
                }
              }')
            echo "Firewall response: $RESPONSE"
            FIREWALL_ID=$(echo $RESPONSE | jq -r '.id')
            if [ -z "$FIREWALL_ID" ] || [ "$FIREWALL_ID" = "null" ]; then
              echo "Failed to create firewall"
              exit 1
            fi
            echo "Firewall created: $FIREWALL_ID"
          else
            echo "Firewall already exists: $FIREWALL_ID"
          fi
          echo "firewall_id=$FIREWALL_ID" >> $GITHUB_OUTPUT

      - name: Check for existing app VM
        id: check_vm
        run: |
          EXISTING=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/linode/instances | \
            jq '[.data[] | select(.tags != null and (.tags | contains(["linode-automation-app"])) and (.label | startswith("app-")))]')
          COUNT=$(echo $EXISTING | jq 'length')
          echo "Found $COUNT existing app VM(s)"
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Create VM
        if: steps.check_vm.outputs.count == '0'
        run: |
          echo "No existing VM found — creating new one..."
          USERDATA=$(base64 -w0 cloud-init.yaml)
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -X POST https://api.linode.com/v4/linode/instances \
            -d "{
              \"image\": \"linode/ubuntu22.04\",
              \"region\": \"us-east\",
              \"type\": \"g6-nanode-1\",
              \"label\": \"app-new-${{ github.run_id }}\",
              \"tags\": [\"linode-automation-app\"],
              \"root_pass\": \"${{ secrets.VM_ROOT_PASS }}\",
              \"authorized_keys\": [\"${{ secrets.SSH_PUBLIC_KEY }}\"],
              \"private_ip\": true,
              \"metadata\": {\"user_data\": \"$USERDATA\"}
            }")

          echo "Create response: $RESPONSE"
          LINODE_ID=$(echo $RESPONSE | jq -r '.id')

          if [ -z "$LINODE_ID" ] || [ "$LINODE_ID" = "null" ]; then
            echo "VM creation failed — full response above"
            exit 1
          fi

          echo "VM created with ID: $LINODE_ID — renaming to app-$LINODE_ID"
          curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -X PUT https://api.linode.com/v4/linode/instances/$LINODE_ID \
            -d "{\"label\": \"app-$LINODE_ID\"}"

          echo "Assigning firewall ${{ steps.setup_firewall.outputs.firewall_id }}..."
          curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -X POST https://api.linode.com/v4/networking/firewalls/${{ steps.setup_firewall.outputs.firewall_id }}/devices \
            -d "{\"id\": $LINODE_ID, \"type\": \"linode\"}"

          echo "VM provisioned: app-$LINODE_ID"

      - name: Wait for VM to be running
        run: |
          echo "Waiting for VM to reach running state..."
          STATUS=""
          for i in $(seq 1 30); do
            VM=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
              https://api.linode.com/v4/linode/instances | \
              jq '.data[] | select(.tags != null and (.tags | contains(["linode-automation-app"])) and (.label | startswith("app-")))')
            STATUS=$(echo $VM | jq -r '.status')
            LABEL=$(echo $VM | jq -r '.label')
            echo "Attempt $i: $LABEL status=$STATUS"
            if [ "$STATUS" = "running" ]; then
              echo "VM is running"
              break
            fi
            sleep 15
          done
          if [ "$STATUS" != "running" ]; then
            echo "VM did not reach running state after 7.5 minutes"
            exit 1
          fi

      - name: Get VM details
        id: get_vm
        run: |
          VM=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/linode/instances | \
            jq '.data[] | select(.tags != null and (.tags | contains(["linode-automation-app"])) and (.label | startswith("app-")))')

          IP=$(echo $VM | jq -r '.ipv4[0]')
          VM_ID=$(echo $VM | jq -r '.id')
          LABEL=$(echo $VM | jq -r '.label')

          echo "vm_ip=$IP" >> $GITHUB_OUTPUT
          echo "vm_id=$VM_ID" >> $GITHUB_OUTPUT
          echo "VM: $LABEL | ID: $VM_ID | IP: $IP"

          if [ -z "$IP" ] || [ "$IP" = "null" ]; then
            echo "Failed to get VM IP"
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: provision

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Allow SSH from runner IP
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Runner IP: $RUNNER_IP"

          CURRENT_RULES=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/networking/firewalls/${{ needs.provision.outputs.firewall_id }}/rules)

          NEW_INBOUND=$(echo $CURRENT_RULES | jq --arg ip "$RUNNER_IP/32" \
            '[.inbound[] | select(.label != "temp-ssh-runner")] + [{
              "label": "temp-ssh-runner",
              "action": "ACCEPT",
              "protocol": "TCP",
              "ports": "22",
              "addresses": {"ipv4": [$ip]}
            }]')

          curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -X PUT https://api.linode.com/v4/networking/firewalls/${{ needs.provision.outputs.firewall_id }}/rules \
            -d "{\"inbound_policy\": \"DROP\", \"outbound_policy\": \"ACCEPT\", \"inbound\": $NEW_INBOUND}"
          echo "SSH temporarily allowed from $RUNNER_IP"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Waiting for SSH to be ready on ${{ needs.provision.outputs.vm_ip }}..."
          for i in $(seq 1 20); do
            if ssh-keyscan -H ${{ needs.provision.outputs.vm_ip }} >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Attempt $i: not ready yet..."
            sleep 15
          done

      - name: Deploy app
        run: |
          rsync -avz --exclude 'node_modules' --exclude '.git' \
            ./ root@${{ needs.provision.outputs.vm_ip }}:/opt/app/

      - name: Install dependencies and start app
        run: |
          ssh root@${{ needs.provision.outputs.vm_ip }} << 'EOF'
            cd /opt/app
            npm install
            pm2 restart app || pm2 start npm --name "app" -- start
            pm2 save
          EOF

      - name: Push configs to VM
        run: |
          ssh root@${{ needs.provision.outputs.vm_ip }} << 'EOF'
            cp /opt/app/alloy/config.alloy /etc/alloy/config.alloy
            cp /opt/app/vault/agent.hcl /etc/vault.d/agent.hcl
          EOF

      - name: Write Vault Agent token
        run: |
          ssh root@${{ needs.provision.outputs.vm_ip }} \
            "echo '${{ secrets.VAULT_AGENT_TOKEN }}' > /etc/vault.d/token && chmod 600 /etc/vault.d/token"

      - name: Setup Vault Agent service
        run: |
          ssh root@${{ needs.provision.outputs.vm_ip }} << 'EOF'
            printf '[Unit]\nDescription=Vault Agent\nAfter=network.target\n\n[Service]\nEnvironment=VAULT_ADDR=http://192.168.215.38:8200\nExecStart=/usr/bin/vault agent -config=/etc/vault.d/agent.hcl\nRestart=always\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/vault-agent.service
            systemctl daemon-reload
            systemctl enable vault-agent
            systemctl restart vault-agent
          EOF

      - name: Mount object storage
        run: |
          ssh root@${{ needs.provision.outputs.vm_ip }} << 'EOF'
            export VAULT_ADDR="http://192.168.215.38:8200"
            export VAULT_TOKEN=$(cat /etc/vault.d/token)
            OBJ_KEY=$(vault kv get -field=object_storage_key secret/linode)
            OBJ_SECRET=$(vault kv get -field=object_storage_secret secret/linode)
            BUCKET=$(vault kv get -field=bucket_name secret/linode)
            REGION=$(vault kv get -field=bucket_region secret/linode)

            echo "${OBJ_KEY}:${OBJ_SECRET}" > /root/.passwd-s3fs
            chmod 600 /root/.passwd-s3fs
            mkdir -p /mnt/backup
            mountpoint -q /mnt/backup || s3fs ${BUCKET} /mnt/backup \
              -o passwd_file=/root/.passwd-s3fs \
              -o url=https://${REGION}.linodeobjects.com \
              -o use_path_request_style

            grep -q "s3fs" /etc/fstab || \
              echo "${BUCKET} /mnt/backup fuse.s3fs _netdev,allow_other,use_path_request_style,passwd_file=/root/.passwd-s3fs,url=https://${REGION}.linodeobjects.com 0 0" >> /etc/fstab
          EOF

      - name: Backup configs to object storage
        run: |
          ssh root@${{ needs.provision.outputs.vm_ip }} << 'EOF'
            mkdir -p /mnt/backup/configs
            cp /etc/alloy/config.alloy /mnt/backup/configs/
            cp /etc/vault.d/agent.hcl /mnt/backup/configs/
          EOF

      - name: Verify deployment
        run: |
          ssh root@${{ needs.provision.outputs.vm_ip }} << 'EOF'
            echo "=== PM2 ==="
            pm2 status
            echo "=== Vault Agent ==="
            systemctl is-active vault-agent
            echo "=== Alloy health ==="
            curl -s http://localhost:12345/-/healthy
            echo "=== nginx ==="
            systemctl is-active nginx
            echo "=== Object storage ==="
            df -h | grep backup || echo "not mounted"
          EOF

      - name: Remove SSH runner access
        if: always()
        run: |
          CURRENT_RULES=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            https://api.linode.com/v4/networking/firewalls/${{ needs.provision.outputs.firewall_id }}/rules)

          NEW_INBOUND=$(echo $CURRENT_RULES | jq '[.inbound[] | select(.label != "temp-ssh-runner")]')

          curl -s \
            -H "Authorization: Bearer ${{ secrets.LINODE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -X PUT https://api.linode.com/v4/networking/firewalls/${{ needs.provision.outputs.firewall_id }}/rules \
            -d "{\"inbound_policy\": \"DROP\", \"outbound_policy\": \"ACCEPT\", \"inbound\": $NEW_INBOUND}"
          echo "SSH access removed"
