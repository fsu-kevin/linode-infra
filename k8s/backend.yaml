apiVersion: apps/v1
kind: Deployment
metadata:
  name: linode-infra-backend
  namespace: demos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linode-infra-backend
  template:
    metadata:
      labels:
        app: linode-infra-backend
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: backend
          image: harbor.kevinlapomme.com/kevin/linode-infra-backend:IMAGE_TAG
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: linode-infra-backend
  namespace: demos
spec:
  selector:
    app: linode-infra-backend
  ports:
    - port: 3001
      targetPort: 3001
