apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull-secret
  namespace: demos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: harbor-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"harbor.kevinlapomme.com":{"username":"admin","password":"{{ .password }}","auth":"{{ printf "admin:%s" .password | b64enc }}"}}}
  data:
    - secretKey: password
      remoteRef:
        key: secret/platform/harbor
        property: admin-password
