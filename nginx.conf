server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service.
    # Because the browser talks to nginx and nginx talks to the backend,
    # there are no cross-origin requests and no CORS config needed.
    location /api/ {
        proxy_pass http://linode-infra-backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback — any path not matching a real file serves index.html
    # so React Router handles client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
